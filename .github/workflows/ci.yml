# Build and every test on each push (roadmap task 0.7). Lint and format checks join in 0.9.
name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Linux, like the production image, so time zone data and the runtime behave the same.
    # Docker is preinstalled, which the integration tests need (Testcontainers).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Yalfan.slnx

      # Warnings are errors (Directory.Build.props), so a warning fails the run here too.
      - name: Build
        run: dotnet build Yalfan.slnx --no-restore

      - name: Test
        run: dotnet test --solution Yalfan.slnx --no-build
