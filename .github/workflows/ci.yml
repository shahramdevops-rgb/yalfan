# Every check on each push: format, lint, build and every test, for the .NET solution and the
# panel (ADR 0015). Build and tests since task 0.7, the panel since 0.8, format and lint since 0.9.
name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each check runs even when an earlier one failed (`!cancelled()`), so one push reports every
# problem at once instead of one per push. A check is skipped only when what it needs is missing
# (no restore, no install, or no build for the tests).
jobs:
  dotnet:
    # Linux, like the production image, so time zone data and the runtime behave the same.
    # Docker is preinstalled, which the integration tests need (Testcontainers).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        id: restore
        run: dotnet restore Yalfan.slnx

      # Whitespace and layout by .editorconfig. Fix locally with `dotnet format whitespace Yalfan.slnx`.
      - name: Format
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet format whitespace Yalfan.slnx --verify-no-changes --no-restore

      # Also the lint: warnings are errors (Directory.Build.props), so an analyzer or code style
      # violation fails the build here, as it does on the developer's machine.
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet build Yalfan.slnx --no-restore

      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --solution Yalfan.slnx --no-build

  panel:
    runs-on: ubuntu-latest
    # The screenshots pull the Playwright image (about 1 GB) on each run.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/panel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/panel/.nvmrc
          cache: npm
          cache-dependency-path: web/panel/package-lock.json

      # Exactly the versions in package-lock.json.
      - name: Install
        id: install
        run: npm ci

      # ESLint with type information; any warning fails it too.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      # Prettier. Fix locally with `npm run format`.
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      # Generates the API types from openapi/panel.json, type-checks, and bundles.
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      # Screenshots of the main pages, compared inside the pinned Playwright image, the same one
      # the developer's PC uses (ADR 0028). It needs only node and Docker, not the install above:
      # the packages are installed inside the image.
      - name: Screens
        id: screens
        if: ${{ !cancelled() }}
        run: npm run screens

      # The expected, actual and diff pictures of each page that changed.
      - name: Keep the screenshot differences
        if: ${{ !cancelled() && steps.screens.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: screens
          path: artifacts/check/screens
          retention-days: 7
