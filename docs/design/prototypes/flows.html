<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>یلفان — نمونه‌ی سه جریان روزانه</title>
<!--
  Task 2.0 (docs/ROADMAP.md): clickable prototypes of the three daily flows of Phase 2, issuing
  work, receiving with QC, and a contractor's account and settlement, each in two or three
  variants, shown to the owner before any screen is built. Not product code: nothing here is
  tested, built or shipped, and nothing is saved; every name and number is made up.

  One self-contained file on purpose: it is sent to the owner's phone in a messenger and opens
  offline, so it makes no network request (the font is embedded at the end). The colours copy the
  role names and values of web/panel/src/index.css and the sizes follow docs/design/UI.md, so the
  owner judges the flow, not a different look. Container queries instead of media queries, so the
  "phone view" frame on a desktop lays the page out as a phone would.

  Once the owner has chosen, the rejected variants are deleted (git keeps them) and the choice is
  recorded in docs/design/flows.md.
-->
<style>
:root {
  --page: #f5f1e8; --surface: #fff;
  --subtle: oklch(98.5% 0.001 106.423); --fill: oklch(97% 0.001 106.424);
  --fill-strong: oklch(92.3% 0.003 48.717); --fill-off: oklch(86.9% 0.005 56.366);
  --line-soft: oklch(97% 0.001 106.424); --line: oklch(92.3% 0.003 48.717);
  --line-strong: oklch(86.9% 0.005 56.366);
  --ink: oklch(21.6% 0.006 56.043); --ink-soft: oklch(26.8% 0.007 34.298);
  --label: oklch(37.4% 0.01 67.558); --body: oklch(44.4% 0.011 73.639);
  --muted: oklch(55.3% 0.013 58.071); --faint: oklch(70.9% 0.01 56.259);
  --brand: #4b5a34; --brand-strong: #3c4829; --brand-line: #6e7f52; --brand-edge: #d2dabf;
  --brand-glow: #e5ebd8; --brand-soft: #f3f6ec; --on-brand: #fff;
  --danger: oklch(50.5% 0.213 27.518); --danger-strong: oklch(44.4% 0.177 26.899);
  --danger-line: oklch(63.7% 0.237 25.331); --danger-edge: oklch(88.5% 0.062 18.334);
  --danger-soft: oklch(97.1% 0.013 17.38);
  --warning: oklch(47.3% 0.137 46.201); --warning-strong: oklch(41.4% 0.112 45.904);
  --warning-soft: oklch(98.7% 0.022 95.277); --warning-fill: oklch(96.2% 0.059 95.617);
  --success: oklch(44.8% 0.119 151.328);
  --font: 'Vazirmatn Variable', Tahoma, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); background: var(--page); color: var(--ink); font-size: 16px;
  line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
p, h1, h2, h3 { margin: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.block { display: block; }
.grow { flex: 1; min-width: 0; }
.small { font-size: .875rem; } .xs { font-size: .75rem; }
.body { color: var(--body); } .muted { color: var(--muted); } .bold { font-weight: 700; }
.end { text-align: end; }
.between { display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: .75rem; }
.warn-text { color: var(--warning); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* The prototype's own bar: not part of the panel, so it is drawn dark to stand apart. */
.proto { background: var(--ink); color: var(--surface); padding: .75rem 1rem; display: flex;
  flex-direction: column; gap: .6rem; font-size: .875rem; }
.proto-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.proto .tab { height: 2.25rem; padding: 0 .9rem; border-radius: 999px; border: 1px solid var(--body);
  background: transparent; color: var(--surface); }
.proto .tab[aria-pressed=true] { background: var(--brand-soft); color: var(--brand-strong);
  border-color: var(--brand-soft); font-weight: 600; }
.proto .tab.quiet { border-style: dashed; }
.proto-desc { color: var(--fill-strong); }
.proto-label { color: var(--fill-off); }
.proto details { color: var(--fill-strong); }
.proto summary { cursor: pointer; color: var(--surface); }
.proto ul { margin: .5rem 0 0; padding-inline-start: 1.25rem; display: flex; flex-direction: column; gap: .35rem; }
.spacer { flex: 1; }
@media (max-width: 520px) { .phone-toggle { display: none; } }

/* The panel's frame. */
.app { container-type: inline-size; min-height: 70vh; }
@media (min-width: 521px) {
  .app.phone { width: 390px; margin: 1.5rem auto; border-radius: 1.75rem; overflow: clip;
    box-shadow: 0 0 0 10px var(--ink), 0 16px 40px rgb(0 0 0 / .25); min-height: 760px; }
}
.frame { display: flex; min-height: inherit; }
.side { display: none; width: 16rem; flex-shrink: 0; border-inline-end: 1px solid var(--line); background: var(--surface); }
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { height: 4rem; display: flex; align-items: center; gap: .75rem; border-bottom: 1px solid var(--line);
  background: var(--surface); padding-inline: 1rem; }
.icon-btn { border: 0; background: none; padding: .5rem; border-radius: .5rem; color: var(--body); display: grid; }
.icon-btn:hover { background: var(--fill); }
.today { display: none; font-size: .875rem; color: var(--muted); }
.who { margin-inline-start: auto; text-align: end; line-height: 1.3; }
.who-name { font-size: .875rem; font-weight: 500; } .who-role { font-size: .75rem; color: var(--muted); }
.logout { border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); border-radius: .5rem;
  padding: .5rem .75rem; font-size: .875rem; color: var(--body); }
.main { flex: 1; padding: 1.5rem 1rem 2rem; }
.page { max-width: 48rem; margin-inline: auto; display: flex; flex-direction: column; gap: 1.5rem; }
.nav { display: flex; flex-direction: column; gap: 1.5rem; padding: 1rem; }
.brandbox { display: flex; align-items: center; gap: .75rem; padding: .25rem .5rem; }
.logo { width: 2.5rem; height: 2.5rem; border-radius: .5rem; background: var(--brand); color: var(--on-brand);
  display: grid; place-items: center; }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .25rem; }
.navi { display: flex; align-items: center; gap: .75rem; width: 100%; padding: .6rem .75rem; border-radius: .5rem;
  border: 0; background: none; color: var(--label); text-align: start; }
.navi:hover { background: var(--fill); }

  .only-phone { display: none !important; } }

/* Page parts. */

.ph-links { display: flex; justify-content: space-between; }
.tlink { color: var(--brand); background: none; border: 0; padding: .25rem; font-size: .875rem; }
.tlink:hover { color: var(--brand-strong); text-decoration: underline; }

.card.g4 { gap: 1rem; }
.h2 { font-size: 1.125rem; font-weight: 700; }
.h3 { font-weight: 700; }
.hint { font-size: .875rem; color: var(--muted); margin-top: .25rem; }
.title { font-weight: 600; }
.detail { font-size: .875rem; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; height: 3rem;

.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-strong); }
.btn.primary:disabled { background: var(--fill-off); color: var(--muted); cursor: not-allowed; }
.btn.secondary { background: var(--surface); color: var(--ink-soft); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn.secondary:hover { background: var(--subtle); }

.btn.danger { background: var(--surface); color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger-edge); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.big { height: 3.5rem; font-size: 1.05rem; }
.btn.block { width: 100%; }
.self-start { align-self: flex-start; }
.btns { display: flex; flex-wrap: wrap; gap: .75rem; }

.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip { display: inline-flex; align-items: center; gap: .375rem; height: 2.5rem; padding: 0 .875rem;
  border-radius: 999px; border: 0; background: var(--surface); color: var(--label); font-size: .875rem;
  box-shadow: inset 0 0 0 1px var(--line-strong); }
.chip:hover { background: var(--subtle); }

.num-in { text-align: center; font-weight: 600; }
.ferr { font-size: .875rem; color: var(--danger); }
.actions { display: flex; flex-direction: column; gap: 1rem; border-top: 1px solid var(--line-soft); padding-top: 1.25rem; }
.inset { display: flex; flex-direction: column; gap: 1.25rem; border-radius: .75rem; padding: 1rem;

.notice { border-radius: .5rem; padding: .5rem .75rem; font-size: .875rem; }
.notice.warning { background: var(--warning-soft); color: var(--warning-strong); }
.notice.danger { background: var(--danger-soft); color: var(--danger-strong); }
.notice.brand { background: var(--brand-soft); color: var(--brand-strong); }
.badge { flex-shrink: 0; border-radius: 999px; padding: .125rem .5rem; font-size: .75rem; white-space: nowrap; font-weight: 400; }
.badge.brand { background: var(--brand-soft); color: var(--brand-strong); }
.badge.warning { background: var(--warning-soft); color: var(--warning-strong); }

.badge.muted { background: var(--fill); color: var(--muted); }

.money { display: inline-flex; flex-direction: column; }
.money .amt { font-weight: 500; color: var(--ink); white-space: nowrap; }
.money .words { font-size: .75rem; color: var(--muted); }

.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: .75rem; padding: .875rem 0; border-top: 1px solid var(--line-soft); }
.row:first-child { border-top: 0; padding-top: 0; }
.row-end { display: flex; flex-direction: column; align-items: flex-end; gap: .35rem; }
.stage { display: flex; flex-direction: column; gap: .75rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }

.tap:hover { background: var(--subtle); }
.tap .title { font-size: 1.05rem; }
.chev { color: var(--faint); display: grid; }
.qrow { display: flex; align-items: center; gap: .75rem; padding: .625rem 0; border-top: 1px solid var(--line-soft); }
.qrow:first-child { border-top: 0; }
.qrow .input { width: 6.5rem; flex-shrink: 0; }
.qblock { display: flex; flex-direction: column; gap: .5rem; padding: .75rem 0; border-top: 1px solid var(--line-soft); }
.qblock:first-of-type { border-top: 0; padding-top: 0; }

.stepper { display: grid; grid-template-columns: 3.25rem 1fr 3.25rem; gap: .5rem; align-items: center; }

.stepper button:hover { background: var(--fill-strong); }
.stepper button:disabled { color: var(--faint); background: var(--subtle); cursor: not-allowed; }
.stepper .input { height: 3.25rem; text-align: center; font-size: 1.25rem; font-weight: 700; }
.footbar { position: sticky; bottom: 0; margin-inline: -1rem; margin-bottom: -2rem; padding: 1rem;

.progress { display: flex; gap: .375rem; }
.progress span { flex: 1; height: .375rem; border-radius: 999px; background: var(--fill-strong); }
.progress span.on { background: var(--brand); }
.dl { display: flex; flex-direction: column; margin: 0; }
.dl > div { display: flex; gap: 1rem; padding: .625rem 0; border-top: 1px solid var(--line-soft); }
.dl > div:first-child { border-top: 0; padding-top: 0; }
.dl dt { width: 5rem; flex-shrink: 0; color: var(--muted); font-size: .875rem; }
.dl dd { margin: 0; font-weight: 500; }

.picker .options { display: flex; flex-direction: column; border-radius: .5rem; box-shadow: 0 0 0 1px var(--line);

.opt { display: flex; align-items: center; gap: .5rem; width: 100%; text-align: start; border: 0; background: var(--surface);
  padding: .625rem .75rem; border-top: 1px solid var(--line-soft); }
.opt:first-child { border-top: 0; }
.opt:hover { background: var(--subtle); }
.opt.hi { background: var(--brand-soft); }
.chosen { display: flex; align-items: center; gap: .75rem; min-height: 3rem; border-radius: .5rem; padding: .5rem .75rem;
  background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand-line); }

.stats { display: grid; gap: .75rem; grid-template-columns: 1fr; }
@container (min-width: 640px) { .stats { grid-template-columns: 1fr 1fr 1fr; } }
.stat { border-radius: .75rem; background: var(--subtle); padding: .875rem; display: flex; flex-direction: column; gap: .25rem;
  box-shadow: inset 0 0 0 1px var(--line-soft); }
.stat.main { background: var(--brand-soft); }
.tick { display: flex; align-items: center; gap: .75rem; width: 100%; text-align: start; border: 0; background: none;
  padding: .875rem 0; border-top: 1px solid var(--line-soft); }
.tick:first-child { border-top: 0; }
.tick .box { width: 1.5rem; height: 1.5rem; border-radius: .375rem; box-shadow: inset 0 0 0 2px var(--line-strong);
  display: grid; place-items: center; flex-shrink: 0; color: var(--on-brand); font-size: .85rem; }
.tick[aria-pressed=true] .box { background: var(--brand); box-shadow: none; }
.tick:disabled { cursor: default; }
.tick:disabled .box { background: var(--fill); }

/* The account's ledger: a table from 640px up, two lines per row on a phone. */
.lrow { display: grid; grid-template-columns: 1fr auto; grid-template-areas: 'text amount' 'date balance';
  gap: .25rem .75rem; padding: .75rem 0; border-top: 1px solid var(--line-soft); }
.lrow.head { display: none; }
.l-date { grid-area: date; font-size: .8rem; color: var(--muted); }
.l-text { grid-area: text; }
.l-cr, .l-dr { grid-area: amount; text-align: end; }
.l-bal { grid-area: balance; text-align: end; }
.lrow .empty { display: none; }
.lrow.off .l-text > .block:first-child { color: var(--faint); }
@container (min-width: 640px) {
  .lrow { grid-template-columns: 5.5rem 1fr 9rem 9rem 9rem; grid-template-areas: 'date text cr dr balance'; align-items: start; }
  .lrow.head { display: grid; font-size: .8rem; color: var(--muted); font-weight: 500; border-top: 0; padding-top: 0; }
  .l-cr { grid-area: cr; } .l-dr { grid-area: dr; }
  .lrow .empty { display: block; }
}

dialog.dlg { border: 0; border-radius: 1rem; padding: 1.5rem; width: calc(100% - 2rem); max-width: 28rem;
  box-shadow: 0 20px 50px rgb(0 0 0 / .25); color: var(--ink); }
dialog.dlg::backdrop { background: rgb(28 25 23 / .45); }
.dlg-body { display: flex; flex-direction: column; gap: 1rem; }
.dlg-btns { display: flex; gap: .75rem; justify-content: flex-end; flex-wrap: wrap; }
html:has(dialog[open]) { overflow: hidden; }
.toasts { position: fixed; inset-inline: 0; bottom: 1.25rem; display: flex; flex-direction: column; align-items: center;
  gap: .5rem; pointer-events: none; z-index: 50; }
.toast { background: var(--ink); color: var(--surface); padding: .75rem 1rem; border-radius: .75rem; font-size: .9rem;
  max-width: min(26rem, calc(100% - 2rem)); box-shadow: 0 8px 24px rgb(0 0 0 / .2); }
</style>

<body>
<div id="root"></div>
<dialog id="dlg" class="dlg"></dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script>
'use strict';
// ---------- Numbers, money, dates (ported from web/panel/src/shared/format) ----------
const faNum = new Intl.NumberFormat('fa-IR', { maximumFractionDigits: 0 });
const n = (v) => faNum.format(v);
const fa = (s) => String(s).replace(/[0-9]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
const latin = (s) => String(s ?? '').replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const toInt = (s) => { const d = latin(s).replace(/[^0-9]/g, ''); return d ? Math.min(parseInt(d, 10), 1e12) : 0; };
const digitsOnly = (s) => fa(latin(s).replace(/[^0-9]/g, ''));
const sum = (a) => a.reduce((x, y) => x + y, 0);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const norm = (s) => latin(s).replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/‌/g, '').replace(/\s+/g, ' ').toLowerCase();

const ONES = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه'];
const TEENS = ['ده', 'یازده', 'دوازده', 'سیزده', 'چهارده', 'پانزده', 'شانزده', 'هفده', 'هجده', 'نوزده'];
const TENS = ['', '', 'بیست', 'سی', 'چهل', 'پنجاه', 'شصت', 'هفتاد', 'هشتاد', 'نود'];
const HUNDREDS = ['', 'صد', 'دویست', 'سیصد', 'چهارصد', 'پانصد', 'ششصد', 'هفتصد', 'هشتصد', 'نهصد'];
function words(v) { return v === 0 ? 'صفر' : v < 0 ? `منفی ${pos(-v)}` : pos(v); }
function pos(v) {
  if (v >= 1e9) return scaled(v, 1e9, `${pos(Math.floor(v / 1e9))} میلیارد`);
  if (v >= 1e6) return scaled(v, 1e6, `${below(Math.floor(v / 1e6))} میلیون`);
  if (v >= 1e3) { const c = Math.floor(v / 1e3); return scaled(v, 1e3, c === 1 ? 'هزار' : `${below(c)} هزار`); }
  return below(v);
}
function scaled(v, s, head) { const r = v % s; return r === 0 ? head : `${head} و ${pos(r)}`; }
function below(v) {
  const p = []; const h = Math.floor(v / 100); const r = v % 100;
  if (h) p.push(HUNDREDS[h]);
  if (r >= 10 && r < 20) p.push(TEENS[r - 10]);
  else { if (r >= 20) p.push(TENS[Math.floor(r / 10)]); if (r % 10) p.push(ONES[r % 10]); }
  return p.join(' و ');
}
/** The quieter line under every Rial amount: its words, in Toman (ADR 0002 point 9, ADR 0024). */
function tomanLine(rial) {
  const m = Math.abs(rial); const t = Math.floor(m / 10); const r = m % 10;
  const w = r === 0 ? `${words(t)} تومان` : t === 0 ? `${words(r)} ریال` : `${words(t)} تومان و ${words(r)} ریال`;
  return rial < 0 ? `منفی ${w}` : w;
}
function money(rial, { large = false, huge = false, off = false } = {}) {
  return `<span class="money${large ? ' large' : ''}${huge ? ' huge' : ''}${off ? ' off' : ''}"><span class="amt">${n(rial)} ریال</span><span class="words">${tomanLine(rial)}</span></span>`;
}

// A fixed "today", so the sample dates read the same on every phone: Saturday 7 Azar 1405.
const TODAY = new Date(2026, 10, 28, 12, 0);
const day = (offset) => { const d = new Date(TODAY); d.setDate(d.getDate() + offset); return d; };

// ---------- Derived facts: what a real API would calculate ----------
const party = (id) => D.parties.find((p) => p.id === id);
const order = (no) => D.orders.find((o) => o.no === no);
const slip = (no) => D.slips.find((s) => s.no === no);
const stageName = (id) => STAGES.find((s) => s.id === id).name;
const rateOf = (model, stage) => MODELS[model].rates[stage] ?? null;
const orderTotal = (o) => sum(o.lines.map((l) => l.qty));
const bag = (s, l) => order(s.order).lines[l.line].bag;
const lineOut = (l) => l.qty - l.acc - l.rej - l.back - l.pending;
const slipQty = (s) => sum(s.lines.map((l) => l.qty - l.back));
const slipOut = (s) => sum(s.lines.map(lineOut));
const slipAcc = (s) => sum(s.lines.map((l) => l.acc));
const slipRework = (s) => sum(s.lines.map((l) => l.rework));
const slipPending = (s) => sum(s.lines.map((l) => l.pending));
const openSlips = (pid) => D.slips.filter((s) => s.party === pid && (slipOut(s) > 0 || slipPending(s) > 0));
const reworkOut = (pid) => sum(D.slips.filter((s) => s.party === pid).map(slipRework));
const pendingOf = (pid) => sum(D.slips.filter((s) => s.party === pid).map(slipPending));
const balance = (pid) => sum(D.ledger.filter((e) => e.party === pid).map((e) => e.amount));
function remaining(o, stage) {
  return o.lines.map((ln, i) => ln.qty - sum(D.slips.filter((s) => s.order === o.no && s.stage === stage)
    .flatMap((s) => s.lines.filter((l) => l.line === i).map((l) => l.qty - l.back))));
}

// ---------- What each step does to the data ----------
function issueSlip(orderNo, stage, pid, perLine, days) {
  const o = order(orderNo); const p = party(pid);
  const s = { no: D.nextSlip++, order: orderNo, stage, party: pid, rate: p.kind === 'worker' ? null : rateOf(o.model, stage),
    issued: 0, back: days, lines: perLine.map(([i, q]) => ({ line: i, qty: q, acc: 0, rej: 0, rework: 0, back: 0, pending: 0 })) };
  D.slips.push(s);
  return s;
}
/** Moving work never edits the slip: its unfinished pieces come back, unpaid, and a new slip goes out. */
function moveWork(s, qty, toPid, days) {
  let left = qty; const perLine = [];
  s.lines.forEach((l) => { const take = Math.min(lineOut(l), left); if (take > 0) { l.back += take; left -= take; perLine.push([l.line, take]); l.rework = Math.max(0, Math.min(l.rework, lineOut(l))); } });
  const t = issueSlip(s.order, s.stage, toPid, perLine, days);
  t.from = s.no; (s.moved = s.moved || []).push({ qty, to: t.no });
  return t;
}
/** A check: the good pieces are credited at the slip's copied rate; rework goes back to be fixed. */
function applyCheck(s, per, fromPending) {
  const t = { acc: 0, rew: 0, rej: 0 };
  s.lines.forEach((l, i) => {
    const c = per[i]; if (!c) return;
    const got = c.acc + c.rew + c.rej; if (!got) return;
    if (fromPending) l.pending -= got;
    l.rework = l.rework - Math.min(l.rework, got) + c.rew;
    l.acc += c.acc; l.rej += c.rej;
    t.acc += c.acc; t.rew += c.rew; t.rej += c.rej;
  });
  if (s.rate && t.acc > 0) D.ledger.push({ id: D.nextEntry++, party: s.party, at: 0, kind: 'work', amount: t.acc * s.rate, slip: s.no, pieces: t.acc, rate: s.rate });
  return t;
}
function countWords(t) {
  const p = []; if (t.acc) p.push(`${n(t.acc)} سالم`); if (t.rew) p.push(`${n(t.rew)} تعمیر`); if (t.rej) p.push(`${n(t.rej)} خراب`);
  return p.join('، ');
}

let PICKS = {};
/**
 * The shared searchable picker that 2.1 builds: type a few letters, arrows move, Enter picks.
 * Once picked it shows as a box with «عوض کردن», so the choice is seen at a glance.
 */
function picker({ k, label, items, chosen, onPick, err, hint, placeholder }) {
  const st = UI.pk[k] || (UI.pk[k] = { q: '', hi: 0 });
  if (chosen) {
    const it = items.find((i) => i.id === chosen) || { title: '' };
    PICKS[k] = { items: [], pick: onPick };
    return `<div class="field"><span class="label">${label}</span><div class="chosen"><div class="grow"><p class="title">${it.title}</p>${it.detail ? `<p class="detail">${it.detail}</p>` : ''}</div>
      ${badges(it.badges)}<button type="button" class="tlink" data-act="unpick" data-pk="${k}" data-k="${k}-change" data-nav>عوض کردن</button></div></div>`;
  }
  const q = norm(st.q.trim());
  const list = items.filter((i) => !q || norm(`${i.title} ${i.search || ''}`).includes(q));
  st.hi = Math.min(st.hi, Math.max(list.length - 1, 0));
  PICKS[k] = { items: list, pick: onPick };
  return `<div class="field picker"><label class="label" for="${k}">${label}</label>
    <input id="${k}" class="input" data-k="${k}" data-pkq="${k}" data-nav value="${esc(st.q)}" placeholder="${placeholder || 'نام را بنویسید…'}" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="${k}-list"${err ? ' aria-invalid="true"' : ''}>
    ${hint ? `<p class="hint">${hint}</p>` : ''}
    <div class="options" id="${k}-list" role="listbox">${list.length ? list.map((i, ix) => `<button type="button" role="option" tabindex="-1" class="opt${ix === st.hi ? ' hi' : ''}" aria-selected="${ix === st.hi}" data-act="pick" data-pk="${k}" data-id="${i.id}">
      <span class="grow"><span class="title block">${i.title}</span>${i.detail ? `<span class="detail block">${i.detail}</span>` : ''}</span>${badges(i.badges)}</button>`).join('') : '<p class="opt muted">چیزی با این نام پیدا نشد.</p>'}</div>
    ${fieldErr(err)}</div>`;
}

/** A work order slip in a list: who, what, how many are still with him, and moving the rest. */
function slipRow(s, { movable = true } = {}) {
  const p = party(s.party); const out = slipOut(s); const acc = slipAcc(s); const rw = slipRework(s); const pend = slipPending(s);
  const facts = [];
  if (acc) facts.push(`${n(acc)} سالم برگشته`);
  if (out) facts.push(`${n(out)} تکه پیشش${rw ? `، ${n(rw)} تای آن تعمیری` : ''}`);
  if (pend) facts.push(`${n(pend)} تکه منتظر بررسی`);
  const moved = (s.moved || []).map((m) => `${n(m.qty)} تکه پس گرفته شد و با برگه‌ی ${n(m.to)} به ${party(slip(m.to).party).name} رفت`);
  const tags = [];
  if (UI.ia.fresh === s.no || s.issued === 0) tags.push(['brand', 'تازه']);
  if (out && s.back < 0) tags.push(['warning', 'دیرکرد']);
  if (!out && !pend) tags.push(['muted', 'تمام شد']);
  const open = UI.mv && UI.mv.slip === s.no;
  return `<div class="row"><div class="grow"><p class="title">${p.name} ${p.kind === 'worker' ? badge('neutral', 'کارگر ثابت') : ''}</p>
      <p class="detail">برگه‌ی ${n(s.no)} · ${s.lines.filter((l) => l.qty - l.back > 0).map((l) => `${bag(s, l)}: ${n(l.qty - l.back)}`).join('، ')} · برگشت ${dayText(s.back)}</p>
      ${s.from ? `<p class="detail">از برگه‌ی ${n(s.from)} منتقل شد</p>` : ''}
      ${facts.length ? `<p class="detail">${facts.join(' · ')}</p>` : ''}${moved.map((m) => `<p class="detail">${m}</p>`).join('')}</div>
    <div class="row-end">${badges(tags)}${movable && out > 0 && !open ? `<button class="tlink" data-act="mv-open" data-v="${s.no}" data-k="mv-open-${s.no}">انتقال به دیگری</button>` : ''}</div></div>
    ${open ? moveInset(s) : ''}`;
}
function moveInset(s) {
  const mv = UI.mv; const p = party(s.party); const out = slipOut(s); const o = order(s.order);
  const q = toInt(mv.qty); const to = mv.party && party(mv.party); const err = mv.err || {};
  const r = rateOf(o.model, s.stage);
  return `<div class="inset">
    <div><h3 class="h3">انتقال کار برگه‌ی ${n(s.no)}</h3>
    <p class="hint">${n(out)} تکه از این برگه هنوز پیش ${p.name} است. برگه‌ی ${n(s.no)} عوض نمی‌شود: این تکه‌ها بی‌مزد از ${p.name} پس گرفته می‌شوند و برگه‌ی تازه‌ای برای نفر دوم صادر می‌شود، تا معلوم بماند هر تکه کجا بوده و با چه نرخی.</p></div>
    ${textField({ k: 'mv-qty', label: 'چند تکه؟', value: mv.qty, path: 'mv.qty', hint: `حداکثر ${n(out)} تکه`, err: err.qty, num: true })}
    ${partyPicker({ k: 'mv-party', label: 'به چه کسی؟', stage: s.stage, exclude: s.party, chosen: mv.party, onPick: (id) => { mv.party = id; }, err: err.party })}
    ${daysField('mv.days', mv.days)}
    ${to && to.kind !== 'worker' && r ? `<p class="small body">نرخ برگه‌ی تازه: ${n(r)} ریال هر تکه، از کارت نرخ امروز.</p>` : ''}
    <div class="btns"><button class="btn primary" data-act="mv-save" data-nav data-k="mv-save">${to && q > 0 ? `انتقال ${n(q)} تکه به ${to.name}` : 'انتقال'}</button>
    <button class="btn secondary" data-act="mv-cancel">انصراف</button></div></div>`;
}

// ---------- Flow 1: issuing work ----------
function checkIssue(o, stage, pid, qty) {
  const rem = remaining(o, stage); const err = {}; let total = 0; const lines = [];
  o.lines.forEach((l, i) => {
    const q = toInt(qty[i]);
    if (q > rem[i]) err['q' + i] = `بیشتر از ${n(rem[i])} تکه‌ی مانده است.`;
    if (q > 0) { total += q; lines.push([i, q]); }
  });
  if (!pid) err.party = 'بگویید کار به چه کسی داده می‌شود.';
  if (total === 0 && !Object.keys(err).some((k) => k.startsWith('q'))) err.total = 'دست‌کم تعداد یک کیف را بنویسید.';
  const p = pid && party(pid);
  const noRate = !!(p && p.kind !== 'worker' && rateOf(o.model, stage) == null);
  return { err, total, lines, rem, noRate };
}
/** The rate copied onto the slip, its pay if all comes back right, and what to notice first. */
function issueSummary(o, stage, p, total) {
  if (!p) return '';
  const out = [];
  const rw = reworkOut(p.id);
  if (rw) out.push(notice('warning', `${p.name} ${n(rw)} تکه‌ی برگشتی برای تعمیر دارد که هنوز نیاورده.`));
  if (p.kind === 'worker') {
    out.push(`<p class="small body">${p.name} کارگر ثابت است و روزمزد می‌گیرد؛ این برگه نرخ و مبلغ ندارد و فقط برای شمردن پیشرفت کار است.</p>`);
    return out.join('');
  }
  const r = rateOf(o.model, stage);
  if (r == null) {
    out.push(notice('danger', `${MODELS[o.model].name} برای ${stageName(stage)} هنوز نرخ ندارد. اول نرخ را در صفحه‌ی مدل ثبت کنید؛ برگه بی‌نرخ صادر نمی‌شود، چون نرخ روز صدور روی برگه ثابت می‌ماند.`));
    return out.join('');
  }
  out.push(`<div class="between"><div><p class="small body">نرخ ${stageName(stage)} ${MODELS[o.model].name}: ${n(r)} ریال هر تکه</p>
    <p class="hint">از کارت نرخ امروز روی برگه کپی می‌شود؛ عوض‌شدن کارت نرخ بعداً این برگه را عوض نمی‌کند.</p></div>
    ${total > 0 ? `<div class="end"><p class="xs muted">مزد ${n(total)} تکه، اگر همه سالم برگردد</p>${money(total * r, { large: true })}</div>` : ''}</div>`);
  return out.join('');
}
const issueLabel = (p, total) => (p && total > 0 ? `صدور برگه: ${n(total)} تکه به ${p.name}` : 'صدور برگه');

function stageBlock(o, st) {
  if (st.id === 'cut') {
    return `<div class="stage"><div class="between"><h3 class="h3">برش</h3>${badge('neutral', 'در کارگاه')}</div>

  }
  const slips = D.slips.filter((s) => s.order === o.no && s.stage === st.id);
  const remT = sum(remaining(o, st.id)); const given = orderTotal(o) - remT; const acc = sum(slips.map(slipAcc));

}

function recvSlipList(sk) {

  return pageHeader({ back: 'بازگشت به همه', backAct: 'rv-back', title: p.name, sub: 'کدام برگه را آورده؟' })
    + `<div class="stack">${os.map((x) => {
      const o = order(x.order); const out = slipOut(x); const rw = slipRework(x); const pend = slipPending(x);
      return `<button class="tap" data-act="rv-slip" data-sk="${sk}" data-v="${x.no}"><span class="grow"><span class="title block">برگه‌ی ${n(x.no)} · ${MODELS[o.model].name}</span>
        <span class="detail block">${stageName(x.stage)} · ${x.lines.map((l) => bag(x, l)).join('، ')}</span>
        <span class="detail block">${n(out)} تکه پیشش · برگشت ${dayText(x.back)}</span></span>
        ${rw ? badge('warning', `${n(rw)} تعمیری`) : ''}${x.back < 0 ? badge('warning', 'دیرکرد') : ''}${pend ? badge('neutral', `${n(pend)} منتظر بررسی`) : ''}<span class="chev">${ICON.chev}</span></button>`;
    }).join('')}</div>`;
}
function slipHead(x, back = 'rv-back') {
  const p = party(x.party); const o = order(x.order);
  return pageHeader({ back: `بازگشت به برگه‌های ${p.name}`, backAct: back, title: `برگه‌ی ${n(x.no)}`, sub: `${p.name} · ${stageName(x.stage)} · ${MODELS[o.model].name}` });
}
const outLines = (x) => x.lines.map((l, i) => ({ l, i, out: lineOut(l) })).filter((z) => z.out > 0);
const reworkHint = (l, out) => `${n(out)} تکه پیشش${l.rework ? `، ${n(l.rework)} تای آن تعمیری` : ''}`;
/** The bar at the bottom: what will be saved, and what it puts into the contractor's account. */
function recvFoot(act, sk, x, t, ok, extra = '') {
  const credit = x.rate ? t.acc * x.rate : 0;
  return `<div class="footbar">${ok ? `<div class="between"><p class="small body">${countWords(t)}</p>${credit ? `<div class="end"><p class="xs muted">به حساب ${party(x.party).name}</p>${money(credit)}</div>` : ''}</div>` : ''}
    <button class="btn primary big block" data-act="${act}" data-sk="${sk}"${ok ? '' : ' disabled'}>${ok ? `ثبت: ${countWords(t)}` : 'تعدادها را بشمارید'}</button>${extra}</div>`;
}

// Variant a: three counters per bag.
function viewRecvA() {
  const s = UI.ra;
  if (!s.party) return recvPartyList('ra');
  if (!s.slip) return recvSlipList('ra');
  const x = slip(s.slip); const t = { acc: 0, rew: 0, rej: 0 }; let over = false;
  const blocks = outLines(x).map(({ l, i, out }) => {
    const c = s.c[i] || (s.c[i] = { acc: '', rew: '', rej: '' });
    const a = toInt(c.acc); const r = toInt(c.rew); const j = toInt(c.rej); const used = a + r + j; const left = out - used;
    if (used > out) over = true;
    t.acc += a; t.rew += r; t.rej += j;
    const cnt = (key, label, hint) => `<div class="field"><span class="label">${label}</span>
      ${stepper({ k: `ra-${i}-${key}`, path: `ra.c.${i}.${key}`, value: c[key], max: toInt(c[key]) + Math.max(left, 0), label: `${label}، ${l.bag || bag(x, l)}` })}${hint ? `<p class="hint">${hint}</p>` : ''}</div>`;
    return `<section class="card"><div><h2 class="h2">${bag(x, l)}</h2><p class="hint">${reworkHint(l, out)}</p></div>
      ${cnt('acc', 'سالم')}${cnt('rew', 'برای تعمیر', 'پیش خودش برمی‌گردد؛ وقتی درست آورد، مزدش داده می‌شود.')}${cnt('rej', 'خراب', 'قابل تعمیر نیست؛ مزد ندارد.')}
      <p class="small ${used > out ? 'ferr' : 'body'}">${used > out ? `بیشتر از ${n(out)} تکه‌ای است که پیشش بوده.` : left === 0 ? `همه‌ی ${n(out)} تکه شمرده شد.` : `${n(left)} تکه هنوز پیشش می‌ماند.`}</p></section>`;
  }).join('');
  return slipHead(x) + blocks + recvFoot('rv-save', 'ra', x, t, !over && t.acc + t.rew + t.rej > 0);
}

// Variant b: all good unless said otherwise.
function defectRows(sk, x, lines, gotOf, editable) {
  const s = UI[sk]; const t = { acc: 0, rew: 0, rej: 0 }; let bad = false; let gotT = 0;
  const rows = lines.map(({ l, i, out }) => {
    const c = s.c[i]; const got = gotOf(c, out); const rew = s.defects ? toInt(c.rew) : 0; const rej = s.defects ? toInt(c.rej) : 0;
    const e1 = editable && got > out ? `بیشتر از ${n(out)} تکه‌ای است که پیشش بوده.` : '';
    const e2 = rew + rej > got ? 'تعمیری و خراب از تکه‌های آمده بیشتر شد.' : '';
    if (e1 || e2) bad = true;
    gotT += got; t.acc += Math.max(got - rew - rej, 0); t.rew += rew; t.rej += rej;
    const input = (key, label) => `<div class="field"><label class="label" for="${sk}-${i}-${key}">${label}</label><input id="${sk}-${i}-${key}" class="input num-in" data-k="${sk}-${i}-${key}" data-in="${sk}.c.${i}.${key}" inputmode="numeric" value="${esc(digitsOnly(c[key]))}" placeholder="۰"></div>`;
    return `<div class="qblock"><div class="qrow"><div class="grow"><p class="title">${bag(x, l)}</p><p class="detail">${editable ? reworkHint(l, out) : `${n(got)} تکه آمده`}</p></div>
        ${editable ? `<input class="input num-in" aria-label="چند تا آورده، ${bag(x, l)}" data-k="${sk}-${i}-got" data-in="${sk}.c.${i}.got" inputmode="numeric" value="${esc(digitsOnly(c.got))}"${e1 ? ' aria-invalid="true"' : ''}>` : ''}</div>${fieldErr(e1)}
      ${s.defects ? `<div class="defects">${input('rew', 'برای تعمیر')}${input('rej', 'خراب')}</div><p class="small body">سالم: ${n(Math.max(got - rew - rej, 0))}</p>${fieldErr(e2)}` : ''}</div>`;
  }).join('');
  return { rows, t, bad, gotT };
}
function allGoodFoot(sk, x, gotT, ok, act) {
  return `<div class="footbar">${x.rate && ok ? `<div class="between"><p class="small body">اگر همه سالم باشد، به حساب ${party(x.party).name}</p>${money(gotT * x.rate)}</div>` : ''}
    <button class="btn primary big block" data-act="${act}" data-sk="${sk}"${ok ? '' : ' disabled'}>همه سالم است · ثبت ${n(gotT)} تکه</button>
    <button class="btn secondary big block" data-act="set" data-path="${sk}.defects" data-val="1" data-bool${ok ? '' : ' disabled'}>چندتایش ایراد دارد</button></div>`;
}
function viewRecvB() {
  const s = UI.rb;
  if (!s.party) return recvPartyList('rb');
  if (!s.slip) return recvSlipList('rb');
  const x = slip(s.slip); const lines = outLines(x);
  lines.forEach(({ i, out }) => { if (!s.c[i]) s.c[i] = { got: fa(out), rew: '', rej: '' }; });
  const { rows, t, bad, gotT } = defectRows('rb', x, lines, (c) => toInt(c.got), true);
  const ok = !bad && gotT > 0;
  return slipHead(x) + `<section class="card"><div><h2 class="h2">چند تا آورده؟</h2><p class="hint">عدد هر کیف از قبل همه‌ی تکه‌های پیش اوست؛ اگر کمتر آورده، عوضش کنید.</p></div>${rows}</section>`
    + (s.defects ? recvFoot('rv-save', 'rb', x, t, ok && t.acc + t.rew + t.rej > 0, '<button class="btn secondary big block" data-act="set" data-path="rb.defects" data-val="" data-bool>همه سالم بود</button>') : allGoodFoot('rb', x, gotT, ok, 'rv-allgood'));
}

// Variant c: the office writes what came back; the checker marks it later on his phone.
function viewRecvC() {
  const s = UI.rc;
  if (UI.role === 'office') {
    if (!s.party) return recvPartyList('rc', { sub: 'چه کسی کار آورده؟ اینجا فقط تعداد آمده نوشته می‌شود؛ بررسی‌کننده بعداً بررسی می‌کند.' });
    if (!s.slip) return recvSlipList('rc');
    const x = slip(s.slip); const lines = outLines(x); let bad = false; let gotT = 0;
    const rows = lines.map(({ l, i, out }) => {
      const c = s.c[i] || (s.c[i] = { got: '' }); const got = toInt(c.got); const e = got > out ? `بیشتر از ${n(out)} تکه‌ای است که پیشش بوده.` : '';
      if (e) bad = true; gotT += got;
      return `<div class="qblock"><div class="qrow"><div class="grow"><p class="title">${bag(x, l)}</p><p class="detail">${reworkHint(l, out)}</p></div>
        <input class="input num-in" aria-label="چند تا آورد، ${bag(x, l)}" data-k="rc-${i}" data-in="rc.c.${i}.got" inputmode="numeric" value="${esc(digitsOnly(c.got))}" placeholder="۰"${e ? ' aria-invalid="true"' : ''}></div>${fieldErr(e)}</div>`;
    }).join('');
    const ok = !bad && gotT > 0;
    return slipHead(x) + `<section class="card"><div><h2 class="h2">چند تا آورد؟</h2><p class="hint">تا بررسی‌کننده بررسی نکند، چیزی به حساب ${party(x.party).name} نمی‌رود.</p></div>${rows}
      <div class="actions"><button class="btn primary self-start" data-act="rc-got"${ok ? '' : ' disabled'}>${ok ? `ثبت آوردن: ${n(gotT)} تکه` : 'تعداد آمده را بنویسید'}</button></div></section>`;
  }
  if (!s.check) {
    const list = D.slips.filter((x) => slipPending(x) > 0);
    return pageHeader({ title: 'منتظر بررسی', sub: list.length ? `${n(list.length)} برگه آمده و منتظر بررسی شماست.` : '' })
      + (list.length ? `<div class="stack">${list.map((x) => `<button class="tap" data-act="rc-check" data-v="${x.no}"><span class="grow"><span class="title block">${party(x.party).name} · برگه‌ی ${n(x.no)}</span>
        <span class="detail block">${MODELS[order(x.order).model].name} · ${stageName(x.stage)} · ${n(slipPending(x))} تکه آمده</span></span><span class="chev">${ICON.chev}</span></button>`).join('')}</div>`
        : '<section class="card"><p class="body">چیزی منتظر بررسی نیست. وقتی دفتر بنویسد کسی کار آورده، اینجا می‌آید.</p></section>');
  }
  const x = slip(s.check); const lines = x.lines.map((l, i) => ({ l, i, out: l.pending })).filter((z) => z.out > 0);
  lines.forEach(({ i }) => { if (!s.c[i] || s.c[i].got !== undefined) s.c[i] = { rew: '', rej: '' }; });
  const { rows, t, bad, gotT } = defectRows('rc', x, lines, (c, out) => out, false);
  const ok = !bad && gotT > 0;
  return slipHead(x, 'rc-uncheck') + `<section class="card"><div><h2 class="h2">آمده</h2><p class="hint">اگر همه سالم است، یک دکمه کافی است.</p></div>${rows}</section>`
    + (s.defects ? recvFoot('rc-save', 'rc', x, t, ok && t.acc + t.rew + t.rej > 0, '<button class="btn secondary big block" data-act="set" data-path="rc.defects" data-val="" data-bool>همه سالم بود</button>') : allGoodFoot('rc', x, gotT, ok, 'rc-allgood'));
}

// ---------- Flow 3: a contractor's account and settlement ----------
const KIND = { payment: 'پرداخت', advance: 'پیش‌پرداخت', deduction: 'کسر' };
function entryText(e, p) {
  if (e.kind === 'work') return { title: `کارکرد برگه‌ی ${n(e.slip)}`, detail: `${n(e.pieces)} تکه‌ی سالم × ${n(e.rate)} ریال` };
  if (e.kind === 'opening') return { title: 'مانده از دفتر کاغذی', detail: 'روز شروع کار با سیستم' };
  if (e.kind === 'reversal') { const o = D.ledger.find((x) => x.id === e.reverses); return { title: `برگشتِ ${KIND[o.kind]} ${dayText(o.at)}`, detail: 'ردیف اصلی پاک نمی‌شود؛ این ردیف اثرش را برمی‌گرداند.' }; }
  if (e.kind === 'deduction') return { title: `کسر: ${esc(e.note)}`, detail: '' };
  return { title: KIND[e.kind], detail: `به شبای •••• ${p.iban || ''}${e.ref ? ` · پیگیری ${esc(e.ref)}` : ''}` };
}
const canReverse = (e) => !e.reversedBy && ['payment', 'advance', 'deduction'].includes(e.kind);
function ledgerView(p) {
  const es = D.ledger.filter((e) => e.party === p.id).sort((a, b) => a.at - b.at || a.id - b.id); let run = 0;
  const rows = es.map((e) => {
    run += e.amount; const cr = e.amount > 0 ? e.amount : 0; const dr = e.amount < 0 ? -e.amount : 0; const off = !!e.reversedBy; const t = entryText(e, p);
    return `<div class="lrow${off ? ' off' : ''}"><span class="l-date">${dayText(e.at)}</span>
      <span class="l-text"><span class="block">${t.title} ${off ? badge('muted', 'برگشت خورد') : ''}</span>${t.detail ? `<span class="detail block">${t.detail}</span>` : ''}
        ${canReverse(e) ? `<button class="tlink" data-act="rev" data-v="${e.id}" data-k="rev-${e.id}">برگشت زدن</button>` : ''}</span>
      <span class="l-cr${cr ? '' : ' empty'}">${cr ? `<span class="only-phone xs muted block">کارکرد</span>${money(cr, { off })}` : ''}</span>
      <span class="l-dr${dr ? '' : ' empty'}">${dr ? `<span class="only-phone xs muted block">${e.kind === 'opening' ? 'بدهی' : 'پرداختی'}</span>${money(dr, { off })}` : ''}</span>
      <span class="l-bal"><span class="only-phone xs muted block">مانده</span>${money(Math.abs(run))}${run < 0 ? '<span class="xs warn-text block">بدهکار</span>' : ''}</span></div>`;
  }).join('');
  return `<div class="ledger"><div class="lrow head"><span>تاریخ</span><span>شرح</span><span class="end">کارکرد</span><span class="end">پرداختی</span><span class="end">مانده</span></div>
    ${rows || '<p class="small body">هنوز ردیفی ندارد.</p>'}</div>`;
}
function balanceText(p, bal) {
  return bal > 0 ? `طلب ${p.name}` : bal < 0 ? `بدهی ${p.name} به کارگاه` : 'حساب صاف است';
}
function accountNotices(p, bal) {
  const out = []; const rw = reworkOut(p.id); const pend = pendingOf(p.id);
  if (bal < 0) out.push(notice('warning', 'این بدهی از مزد کار بعدی‌اش کم می‌شود.'));
  if (rw) out.push(notice('warning', `${p.name} ${n(rw)} تکه‌ی ناقص دارد که هنوز تحویل نداده.`));
  if (pend) out.push(notice('warning', `${n(pend)} تکه آمده و هنوز بررسی نشده؛ تا بررسی نشود به حساب نمی‌رود.`));
  if (!p.iban) out.push(notice('warning', `${p.name} شبا ندارد؛ تا شبا ثبت نشود، پرداختی برایش ثبت نمی‌شود.`));
  return out.join('');
}
function unsettled(p) {
  return D.slips.filter((s) => s.party === p.id && !s.settled && s.rate != null && (slipAcc(s) > 0 || slipOut(s) > 0)).map((s) => {
    const out = slipOut(s); const pend = slipPending(s); const rw = slipRework(s);
    const why = out ? `${n(out)} تکه هنوز پیشش است${rw ? `، ${n(rw)} تای آن تعمیری` : ''}` : pend ? `${n(pend)} تکه منتظر بررسی است` : '';
    return { s, ok: !why, why, earned: slipAcc(s) * s.rate };
  });
}
const ticked = (u) => u.ok && UI.ac.ticks[u.s.no] !== false;
function settleList(p) {
  const list = unsettled(p);
  if (!list.length) return '<p class="small body">برگه‌ی تسویه‌نشده‌ای ندارد.</p>';
  const chosen = list.filter(ticked);
  return `<div class="list">${list.map((u) => `<button class="tick" data-act="tick" data-v="${u.s.no}" aria-pressed="${ticked(u)}"${u.ok ? '' : ' disabled'}>
      <span class="box">${ticked(u) ? '✓' : ''}</span><span class="grow"><span class="block">برگه‌ی ${n(u.s.no)} · ${MODELS[order(u.s.order).model].name} · ${stageName(u.s.stage)}</span>
      <span class="detail block">${n(slipAcc(u.s))} تکه‌ی سالم × ${n(u.s.rate)}${u.why ? ` · ${u.why}، هنوز تسویه نمی‌شود` : ''}</span></span>${money(u.earned, { off: !u.ok })}</button>`).join('')}</div>
    <div class="actions"><div class="between"><p class="small body">کارکرد برگه‌های انتخاب‌شده</p>${money(sum(chosen.map((u) => u.earned)), { large: true })}</div>
    <p class="hint">برگه‌ی تسویه‌شده دیگر عوض نمی‌شود؛ اشتباهش فقط با یک ردیف برگشتی درست می‌شود.</p>
    <button class="btn primary self-start" data-act="st-save"${chosen.length ? '' : ' disabled'}>${chosen.length ? `تسویه‌ی ${n(chosen.length)} برگه` : 'برگه‌ای انتخاب نشده'}</button></div>`;
}
function settlementsCard(p) {
  const list = D.settlements.filter((s) => s.party === p.id);
  if (!list.length) return '';
  return `<section class="card g4"><h2 class="h2">تسویه‌ها</h2><div class="list">${list.map((s) => `<div class="row"><div class="grow"><p class="title">تسویه‌ی ${n(s.no)}</p>
    <p class="detail">${dayText(s.at)} · ${s.slips.map((x) => `برگه‌ی ${n(x)}`).join('، ')} · مانده‌ی حساب در آن روز: ${n(Math.abs(s.balance))} ریال${s.balance < 0 ? ' بدهی' : ''}</p></div>${money(s.earned)}</div>`).join('')}</div></section>`;
}
function payForm(p, bal) {
  const f = UI.ac.pay; const amt = toInt(f.amount); const err = f.err || {};
  const kinds = `<div class="field"><span class="label">چه پرداختی؟</span><div class="chips">${Object.entries(KIND).map(([k, t]) =>
    `<button type="button" class="chip" aria-pressed="${f.kind === k}" data-act="set" data-path="ac.pay.kind" data-val="${k}">${t}</button>`).join('')}</div></div>`;
  if (f.kind !== 'deduction' && !p.iban) {

      <div class="btns"><button class="btn secondary" data-act="noop">افزودن شبا در صفحه‌ی ${p.name}</button><button class="btn secondary" data-act="pay-cancel">بستن</button></div></div>`;
  }
  const over = f.kind === 'payment' && amt > Math.max(bal, 0);
  return `<div class="inset">${kinds}<div class="fields">
    ${textField({ k: 'pay-amount', label: 'مبلغ (ریال)', value: f.amount, path: 'ac.pay.amount', amount: true, err: err.amount, hint: amt ? tomanLine(amt) : 'به ریال' })}
    ${f.kind === 'deduction'
      ? textField({ k: 'pay-reason', label: 'بابت چه؟', value: f.reason, path: 'ac.pay.reason', err: err.reason, hint: 'مثلاً «۲ تکه‌ی خراب برگه‌ی ۱۹»' })
      : `<div class="field"><span class="label">به شبای</span><p>•••• ${p.iban}</p></div>${textField({ k: 'pay-ref', label: 'شماره‌ی پیگیری بانک', value: f.ref, path: 'ac.pay.ref' })}`}
    <div class="field"><span class="label">تاریخ</span><p>امروز، ${fmtDay.format(TODAY)}</p></div></div>
    ${f.kind === 'advance' ? '<p class="hint">پیش‌پرداخت پیش از آمدن کار داده می‌شود و از مزد کارهای بعدی کم می‌شود.</p>' : ''}
    ${over ? notice('warning', `این مبلغ ${n(amt - Math.max(bal, 0))} ریال بیشتر از طلب ${p.name} است؛ بقیه بدهی او می‌شود و از کار بعدی‌اش کم می‌شود.`) : ''}
    <div class="btns"><button class="btn primary" data-act="pay-save" data-k="pay-save">ثبت ${KIND[f.kind]}</button><button class="btn secondary" data-act="pay-cancel">انصراف</button></div></div>`;
}
function viewAccount() {
  const p = party(UI.acct); const bal = balance(p.id); const a = UI.ac;
  const head = pageHeader({ back: 'بازگشت به کنترات‌کارها', title: p.name, sub: 'حساب و تسویه' });
  const balBig = `<div><p class="small body">${balanceText(p, bal)}</p>${bal ? money(Math.abs(bal), { huge: true }) : '<p class="h2">صفر</p>'}</div>`;
  if (UI.v.account === 'a') {
    return head + `<section class="card"><div class="between">${balBig}<div class="btns">
        <button class="btn primary" data-act="pay-open" data-k="pay-open">ثبت پرداخت</button><button class="btn secondary" data-act="st-open" data-k="st-open">تسویه</button></div></div>
      ${accountNotices(p, bal)}${a.pay ? payForm(p, bal) : ''}
      ${a.settle ? `<div class="inset"><div><h3 class="h3">تسویه</h3><p class="hint">برگه‌هایی که تمام شده و بررسی شده‌اند را تیک بزنید.</p></div>${settleList(p)}<button class="btn secondary self-start" data-act="st-cancel">انصراف</button></div>` : ''}</section>
      <section class="card g4"><h2 class="h2">دفتر حساب</h2>${ledgerView(p)}</section>${settlementsCard(p)}`;
  }
  const earned = sum(D.ledger.filter((e) => e.party === p.id && e.kind === 'work').map((e) => e.amount));
  const rowsCount = D.ledger.filter((e) => e.party === p.id).length;
  return head + `<section class="card"><div class="stats">
      <div class="stat"><p class="small body">کارکرد بررسی‌شده</p>${money(earned)}</div>
      <div class="stat"><p class="small body">پیش‌پرداخت، پرداخت و کسر</p>${money(earned - bal)}</div>
      <div class="stat main"><p class="small body">${balanceText(p, bal)}</p>${money(Math.abs(bal), { large: true })}</div></div>
    ${accountNotices(p, bal)}${a.pay ? payForm(p, bal) : '<button class="btn primary self-start" data-act="pay-open" data-k="pay-open">ثبت پرداخت</button>'}</section>
    <section class="card g4"><div><h2 class="h2">برگه‌های تسویه‌نشده</h2><p class="hint">برگه‌ای که تمام شده و بررسی شده تیک خورده است.</p></div>${settleList(p)}</section>
    ${settlementsCard(p)}
    <section class="card g4"><button class="btn secondary self-start" data-act="all">${a.all ? 'بستن دفتر کامل' : `دفتر کامل (${n(rowsCount)} ردیف)`}</button>${a.all ? ledgerView(p) : ''}</section>`;
}

// ---------- Drawing, overlays, focus ----------
const root = document.getElementById('root');
const dlg = document.getElementById('dlg');
function view() {
  const f = UI.flow; const v = UI.v[f]; let content; let user = OPERATOR; let nav = 'full';
  if (f === 'issue') content = v === 'a' ? viewIssueA() : v === 'b' ? viewIssueB() : viewIssueC();
  else if (f === 'receive') {
    if (!(v === 'c' && UI.role === 'office')) { user = CHECKER; nav = 'checker'; }
    content = v === 'a' ? viewRecvA() : v === 'b' ? viewRecvB() : viewRecvC();
  } else { user = OWNER; content = viewAccount(); }
  return protoBar() + `<div class="app${UI.phone ? ' phone' : ''}">${frame(content, user, nav)}</div>`;
}
function navList() { return [...root.querySelectorAll('[data-nav]')].filter((x) => !x.disabled && x.offsetParent !== null); }
function nextNav(el) {
  const list = navList(); const row = el.classList.contains('chip') ? el.closest('.chips') : null;
  for (let i = list.indexOf(el) + 1; i < list.length; i++) if (!row || !row.contains(list[i])) return list[i];
  return null;
}
function render() {
  const a = document.activeElement; const key = a && a.dataset ? a.dataset.k : null;
  const sel = key && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
  const caretEnd = !!(a && a.hasAttribute && a.hasAttribute('data-caret-end'));
  PICKS = {};
  root.innerHTML = view();
  let target = null; let scroll = true;
  if (UI.focusErr) target = root.querySelector('[aria-invalid="true"]');
  else if (UI.focus) target = root.querySelector(`[data-k="${UI.focus}"]`);
  else if (UI.focusAfter) { const el = root.querySelector(`[data-k="${UI.focusAfter}"]`); target = el ? nextNav(el) || el : null; }
  else if (key) { target = root.querySelector(`[data-k="${key}"]`); scroll = false; }
  UI.focusErr = false; UI.focus = null; UI.focusAfter = null;
  if (target) {
    target.focus({ preventScroll: !scroll });
    if (!scroll && sel && target.setSelectionRange) {
      const len = target.value.length;
      try { if (caretEnd) target.setSelectionRange(len, len); else target.setSelectionRange(Math.min(sel[0], len), Math.min(sel[1], len)); } catch { /* not a text field */ }
    }
  }
  if (UI.top) { window.scrollTo(0, 0); UI.top = false; }
}
function toast(text) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = text;
  document.getElementById('toasts').append(el); setTimeout(() => el.remove(), 4500);
}
let DLG = null;
/** The panel's ConfirmDialog: says what happens and to whom; «انصراف» has the focus. */
function confirmBox({ title, body, ok, danger = false, onOk }) {
  DLG = { onOk, back: document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null };
  dlg.innerHTML = `<div class="dlg-body"><h2 class="h2">${title}</h2>${body}<div class="dlg-btns">
    <button class="btn secondary" data-act="dlg-cancel" autofocus>انصراف</button><button class="btn ${danger ? 'danger' : 'primary'}" data-act="dlg-ok">${ok}</button></div></div>`;
  dlg.showModal();
}
dlg.addEventListener('close', () => {
  const back = DLG && DLG.back; DLG = null;
  if (back) { const el = root.querySelector(`[data-k="${back}"]`); if (el) el.focus(); }
});

// ---------- What each button does ----------
const getPath = (path) => path.split('.').reduce((o, p) => (o == null ? o : o[p]), UI);
function setPath(path, val) {
  const parts = path.split('.'); let o = UI;
  for (const p of parts.slice(0, -1)) { if (o[p] == null) o[p] = {}; o = o[p]; }
  o[parts[parts.length - 1]] = val;
}
const recvKey = () => ({ a: 'ra', b: 'rb', c: 'rc' })[UI.v.receive];
function autoPhone() { UI.phone = UI.flow === 'receive' && !(UI.v.receive === 'c' && UI.role === 'office'); }
function finishCheck(sk, x, per, fromPending) {
  const t = applyCheck(x, per, fromPending); const p = party(x.party); const credit = x.rate ? t.acc * x.rate : 0;
  toast(`برگه‌ی ${n(x.no)}: ${countWords(t)} ثبت شد.${credit ? ` ${n(credit)} ریال به حساب ${p.name} رفت.` : ''}`);
  const s = UI[sk]; s.c = {}; s.defects = false;
  if (sk === 'rc') s.check = null;
  else { s.slip = null; if (!D.slips.some((y) => y.party === p.id && slipOut(y) > 0)) s.party = null; }
  UI.top = true;
}
function openPay() {
  const bal = balance(UI.acct);
  UI.ac.pay = { kind: bal > 0 ? 'payment' : 'advance', amount: bal > 0 ? String(bal) : '', ref: '', reason: '', err: {} };
  UI.ac.settle = false; UI.focus = 'pay-amount';
}
function choose(k, id) { PICKS[k].pick(id); UI.pk[k] = { q: '', hi: 0 }; UI.focusAfter = `${k}-change`; render(); }

const ACT = {
  noop: () => toast('این دکمه در نمونه کار نمی‌کند.'),
  flow: (d) => { UI.flow = d.v; autoPhone(); UI.mv = null; UI.top = true; },
  variant: (d) => { UI.v[UI.flow] = d.v; UI.mv = null; autoPhone(); UI.top = true; },
  role: (d) => { UI.role = d.v; autoPhone(); UI.top = true; },
  acct: (d) => { UI.acct = d.v; UI.ac = freshUI().ac; },
  phone: () => { UI.phone = !UI.phone; },
  reset: () => { D = freshData(); Object.assign(UI, freshUI()); toast('همه‌چیز از نو شروع شد.'); UI.top = true; },
  questions: () => { UI.qOpen = !UI.qOpen; },
  set: (d) => setPath(d.path, 'num' in d ? Number(d.val) : 'bool' in d ? d.val === '1' : d.val),
  step: (d) => { const v = Math.max(0, Math.min(Number(d.max), toInt(getPath(d.path)) + Number(d.d))); setPath(d.path, String(v)); },
  pick: (d) => choose(d.pk, d.id),
  unpick: (d) => { PICKS[d.pk].pick(null); UI.pk[d.pk] = { q: '', hi: 0 }; UI.focus = d.pk; },

  'ia-order': (d) => { UI.ia.order = Number(d.v); UI.ia.form = null; UI.mv = null; },
  'ia-open': (d) => {
    const rem = remaining(order(UI.ia.order), d.v); const qty = {};
    rem.forEach((r, i) => { if (r > 0) qty[i] = fa(r); });
    UI.ia.form = { stage: d.v, party: null, qty, days: 7, err: {} }; UI.mv = null; UI.pk['ia-party'] = { q: '', hi: 0 }; UI.focus = 'ia-party';
  },
  'ia-cancel': () => { UI.focus = `ia-open-${UI.ia.form.stage}`; UI.ia.form = null; },
  'ia-save': () => {
    const f = UI.ia.form; const o = order(UI.ia.order); const c = checkIssue(o, f.stage, f.party, f.qty);
    if (Object.keys(c.err).length) { f.err = c.err; UI.focusErr = true; return; }
    const s = issueSlip(o.no, f.stage, f.party, c.lines, f.days); UI.ia.fresh = s.no; UI.ia.form = null;
    toast(`برگه‌ی ${n(s.no)} برای ${party(s.party).name} صادر شد.`);
  },
  'ib-save': () => {
    const f = UI.ib; const o = f.order && order(f.order);
    if (!f.party) { f.err = { party: 'بگویید کار به چه کسی داده می‌شود.' }; UI.focusErr = true; return; }
    if (!o) { f.err = { order: 'بگویید کار از کدام سفارش است.' }; UI.focusErr = true; return; }
    if (!f.stage) { f.err = { stage: 'بگویید چه کاری.' }; return; }
    const c = checkIssue(o, f.stage, f.party, f.qty);
    if (Object.keys(c.err).length) { f.err = c.err; UI.focusErr = true; return; }
    const s = issueSlip(o.no, f.stage, f.party, c.lines, f.days);
    toast(`برگه‌ی ${n(s.no)} برای ${party(s.party).name} صادر شد.`);
    Object.assign(f, { party: null, order: null, stage: null, qty: {}, err: {} }); UI.pk['ib-party'] = { q: '', hi: 0 }; UI.pk['ib-order'] = { q: '', hi: 0 }; UI.focus = 'ib-party';
  },
  'ic-party': (d) => { Object.assign(UI.ic, { party: d.v, step: 2 }); UI.top = true; },
  'ic-job': (d) => { Object.assign(UI.ic, { order: Number(d.v), stage: d.st, qty: {}, step: 3 }); UI.top = true; },
  'ic-next': () => { UI.ic.step = 4; UI.top = true; },
  'ic-back': () => { UI.ic.step -= 1; UI.top = true; },
  'ic-save': () => { const f = UI.ic; const c = checkIssue(order(f.order), f.stage, f.party, f.qty); f.done = issueSlip(f.order, f.stage, f.party, c.lines, f.days).no; UI.top = true; },
  'ic-new': () => { UI.ic = freshUI().ic; UI.top = true; },

  'mv-open': (d) => { const s = slip(Number(d.v)); UI.mv = { slip: s.no, qty: fa(slipOut(s)), party: null, days: 7, err: {} }; UI.ia.form = null; UI.pk['mv-party'] = { q: '', hi: 0 }; UI.focus = 'mv-qty'; },
  'mv-cancel': () => { UI.focus = `mv-open-${UI.mv.slip}`; UI.mv = null; },
  'mv-save': () => {
    const mv = UI.mv; const s = slip(mv.slip); const q = toInt(mv.qty); const out = slipOut(s); const err = {}; const from = party(s.party);
    if (q <= 0) err.qty = 'تعداد را بنویسید.'; else if (q > out) err.qty = `بیشتر از ${n(out)} تکه‌ی پیش ${from.name} است.`;
    const to = mv.party && party(mv.party);
    if (!to) err.party = 'بگویید به چه کسی.';
    else if (to.kind !== 'worker' && rateOf(order(s.order).model, s.stage) == null) err.party = 'این مدل برای این مرحله نرخ ندارد.';
    if (Object.keys(err).length) { mv.err = err; UI.focusErr = true; return; }
    const t = moveWork(s, q, to.id, mv.days); UI.mv = null; UI.ia.fresh = t.no;
    toast(`${n(q)} تکه بی‌مزد از ${from.name} پس گرفته شد و با برگه‌ی ${n(t.no)} به ${to.name} رفت.`);
  },

  'rv-party': (d) => { Object.assign(UI[d.sk], { party: d.v, slip: null, c: {} }); UI.top = true; },
  'rv-slip': (d) => { Object.assign(UI[d.sk], { slip: Number(d.v), c: {}, defects: false }); UI.top = true; },
  'rv-back': () => { const s = UI[recvKey()]; if (s.slip) s.slip = null; else s.party = null; UI.top = true; },
  'rv-save': (d) => {
    const s = UI[d.sk]; const x = slip(s.slip); const per = {};
    Object.entries(s.c).forEach(([i, c]) => {
      if (d.sk === 'ra') per[i] = { acc: toInt(c.acc), rew: toInt(c.rew), rej: toInt(c.rej) };
      else { const rew = toInt(c.rew); const rej = toInt(c.rej); per[i] = { acc: toInt(c.got) - rew - rej, rew, rej }; }
    });
    finishCheck(d.sk, x, per, false);
  },
  'rv-allgood': () => { const s = UI.rb; const x = slip(s.slip); const per = {}; Object.entries(s.c).forEach(([i, c]) => { per[i] = { acc: toInt(c.got), rew: 0, rej: 0 }; }); finishCheck('rb', x, per, false); },
  'rc-got': () => {
    const s = UI.rc; const x = slip(s.slip); let total = 0;
    Object.entries(s.c).forEach(([i, c]) => { const g = toInt(c.got); x.lines[i].pending += g; total += g; });
    toast(`آوردن ${n(total)} تکه ثبت شد؛ منتظر بررسی است و هنوز به حساب ${party(x.party).name} نرفته.`);
    s.slip = null; s.c = {}; if (!D.slips.some((y) => y.party === x.party && slipOut(y) > 0)) s.party = null; UI.top = true;
  },
  'rc-check': (d) => { Object.assign(UI.rc, { check: Number(d.v), c: {}, defects: false }); UI.top = true; },
  'rc-uncheck': () => { UI.rc.check = null; UI.top = true; },
  'rc-allgood': () => { const x = slip(UI.rc.check); const per = {}; x.lines.forEach((l, i) => { if (l.pending) per[i] = { acc: l.pending, rew: 0, rej: 0 }; }); finishCheck('rc', x, per, true); },
  'rc-save': () => {
    const x = slip(UI.rc.check); const per = {};
    x.lines.forEach((l, i) => { if (!l.pending) return; const c = UI.rc.c[i] || {}; const rew = toInt(c.rew); const rej = toInt(c.rej); per[i] = { acc: l.pending - rew - rej, rew, rej }; });
    finishCheck('rc', x, per, true);
  },

  'pay-open': () => openPay(),
  'pay-cancel': () => { UI.ac.pay = null; UI.focus = 'pay-open'; },
  'pay-save': () => {
    const p = party(UI.acct); const f = UI.ac.pay; const amt = toInt(f.amount); const err = {};
    if (!amt) err.amount = 'مبلغ را بنویسید.';
    if (f.kind === 'deduction' && !f.reason.trim()) err.reason = 'بنویسید بابت چه کسر می‌شود.';
    if (Object.keys(err).length) { f.err = err; UI.focusErr = true; return; }
    f.err = {};
    const rw = f.kind !== 'deduction' ? reworkOut(p.id) : 0;
    const body = f.kind === 'deduction'
      ? `<p>از حساب <b>${p.name}</b> مبلغ <b>${n(amt)} ریال</b> (${tomanLine(amt)}) کسر می‌شود، بابت «${esc(f.reason)}».</p>`
      : `<p>به <b>${p.name}</b> مبلغ <b>${n(amt)} ریال</b> (${tomanLine(amt)}) بابت ${KIND[f.kind]}، به شبای •••• ${p.iban}${f.ref ? `، پیگیری ${esc(f.ref)}` : ''}.</p>`;
    confirmBox({
      title: `ثبت ${KIND[f.kind]}؟`,
      body: body + (rw ? notice('warning', `${p.name} ${n(rw)} تکه‌ی ناقص دارد که هنوز تحویل نداده.`) : '') + '<p class="hint">ردیف ثبت‌شده پاک نمی‌شود؛ اشتباه با یک ردیف برگشتی درست می‌شود.</p>',
      ok: rw ? 'پرداخت در هر حال' : `ثبت ${KIND[f.kind]}`,
      onOk: () => {
        D.ledger.push({ id: D.nextEntry++, party: p.id, at: 0, kind: f.kind, amount: -amt, ref: f.ref, note: f.reason });
        UI.ac.pay = null; toast(`${KIND[f.kind]} ${n(amt)} ریالی ثبت شد.`);
      },
    });
  },
  'st-open': () => { UI.ac.settle = true; UI.ac.pay = null; },
  'st-cancel': () => { UI.ac.settle = false; UI.focus = 'st-open'; },
  tick: (d) => { const no = Number(d.v); UI.ac.ticks[no] = UI.ac.ticks[no] === false; },
  'st-save': () => {
    const p = party(UI.acct); const chosen = unsettled(p).filter(ticked);
    const st = { no: D.nextSettle++, party: p.id, at: 0, slips: chosen.map((u) => u.s.no), earned: sum(chosen.map((u) => u.earned)), balance: balance(p.id) };
    chosen.forEach((u) => { u.s.settled = st.no; }); D.settlements.push(st); UI.ac.ticks = {}; UI.ac.settle = false;
    toast(`تسویه‌ی ${n(st.no)} ثبت شد: ${n(chosen.length)} برگه.`);
    if (st.balance > 0 && p.iban) openPay();
  },
  all: () => { UI.ac.all = !UI.ac.all; },
  rev: (d) => {
    const e = D.ledger.find((x) => x.id === Number(d.v)); const amt = Math.abs(e.amount);
    confirmBox({
      title: 'برگشت زدن این ردیف؟', danger: true, ok: 'برگشت زدن ردیف',
      body: `<p>${KIND[e.kind]} ${dayText(e.at)}، ${n(amt)} ریال (${tomanLine(amt)})، برگشت زده می‌شود.</p><p class="hint">هر دو ردیف در دفتر می‌مانند و مانده مثل پیش از آن ردیف می‌شود.</p>`,
      onOk: () => { const id = D.nextEntry++; D.ledger.push({ id, party: e.party, at: 0, kind: 'reversal', amount: -e.amount, reverses: e.id }); e.reversedBy = id; toast('ردیف برگشت خورد.'); },
    });
  },
  'dlg-cancel': () => dlg.close(),
  'dlg-ok': () => { const fn = DLG && DLG.onOk; dlg.close(); if (fn) fn(); },
};

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(t.dataset, t); render();
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.pkq) { const st = UI.pk[t.dataset.pkq]; st.q = t.value; st.hi = 0; render(); return; }
  if (t.dataset.in) {
    setPath(t.dataset.in, t.value);
    for (const pre of ['ia.form', 'ib', 'mv', 'ac.pay']) if (t.dataset.in.startsWith(`${pre}.`)) { const o = getPath(pre); if (o && o.err) o.err = {}; }
    render();
  }
});
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.pkq) {
    const k = t.dataset.pkq; const P = PICKS[k]; const st = UI.pk[k];
    if (e.key === 'ArrowDown') { e.preventDefault(); st.hi = Math.min(st.hi + 1, P.items.length - 1); render(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); st.hi = Math.max(st.hi - 1, 0); render(); return; }
    if (e.key === 'Enter') { e.preventDefault(); const it = P.items[st.hi]; if (it) choose(k, it.id); return; }
  }
  // Enter goes forward (ADR 0031): from a field or a row of chips to the next, and on a button presses it.
  if (e.key === 'Enter' && t.hasAttribute && t.hasAttribute('data-nav') && (t.tagName === 'INPUT' || t.classList.contains('chip'))) {
    e.preventDefault(); const nx = nextNav(t); if (nx) nx.focus();
  }
});
render();
